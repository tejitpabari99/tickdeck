<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickdeck Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* === main.css === font-face + :root tokens (+ derived) */
:root {
  color-scheme: dark;

  /* inputs (Catppuccin Mocha preset); h/s/l are unitless numbers */
  --bgh: 240;
  --bgs: 21;
  --bgl: 15;
  --cm: 1.2;
  --tsm: 1;
  --color-primary: hsl(217, 92%, 83%);
  --color-positive: hsl(115, 54%, 76%);
  --color-negative: hsl(347, 70%, 65%);

  /* derived: surfaces */
  --color-background: hsl(var(--bgh) calc(var(--bgs) * 1%) calc(var(--bgl) * 1%));
  --color-widget-background: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 1) * 1%));
  --color-widget-content-border: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 4) * 1%));
  --color-widget-background-highlight: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 4) * 1%));
  --color-widget-shadow: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) - 0.5) * 1%));
  --color-separator: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 4 * var(--cm)) * 1%));
  --color-popover-background: hsl(var(--bgh) calc((var(--bgs) + 3) * 1%) calc((var(--bgl) + 3) * 1%));
  --color-popover-border: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 12) * 1%));
  --color-progress-border: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 10 * var(--cm)) * 1%));
  --color-progress-value: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) calc((var(--bgl) + 26 * var(--cm)) * 1%));
  --color-graph-gridlines: hsl(var(--bgh) calc(var(--bgs) * 1%) calc((var(--bgl) + 6 * var(--cm)) * 1%));

  /* derived: text tiers (hue = bgh, sat = bgs * tsm, lightness clamped to 100) */
  --color-text-highlight: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) min(100%, calc(85% * var(--cm))));
  --color-text-paragraph: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) min(100%, calc(73% * var(--cm))));
  --color-text-base: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) min(100%, calc(58% * var(--cm))));
  --color-text-base-muted: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) min(100%, calc(52% * var(--cm))));
  --color-text-subdue: hsl(var(--bgh) calc(var(--bgs) * var(--tsm) * 1%) min(100%, calc(35% * var(--cm))));

  /* Tickdeck aliases */
  --prio-high: var(--color-negative);
  --prio-normal: var(--color-primary);
  --prio-low: var(--color-text-subdue);
  --unseen: var(--color-primary);
  --stale: var(--color-text-subdue);

  /* type + spacing scale (rem on a 10px root) */
  --font-family: 'JetBrains Mono', monospace;
  --font-size-h1: 1.7rem;
  --font-size-h2: 1.6rem;
  --font-size-h3: 1.5rem;
  --font-size-h4: 1.4rem;
  --font-size-base: 1.3rem;
  --font-size-h5: 1.2rem;
  --font-size-h6: 1.1rem;
  --widget-gap: 2.3rem;
  --widget-content-padding: 1.5rem 1.7rem;
  --content-bounds-padding: 1.5rem;
  --border-radius: 0.5rem;
  --side-column-width: 30rem;
  --header-height: 4.5rem;
  --header-gap: 2.5rem;
  --list-half-gap: 0.5rem;
}

/* === site.css === page, header, columns, body, scrollbars, selection */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: 400; }
html { font-size: 10px; }
body {
  background: var(--color-background);
  color: var(--color-text-base);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.6;
  font-weight: 400;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "calt" 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  animation: page-in 0.3s ease both;
}
@keyframes page-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
::selection { background: var(--color-primary); color: var(--color-background); }
*:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--color-text-subdue) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--color-text-subdue); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

.page { width: 100%; max-width: 160rem; margin: 0 auto; padding: 0 var(--content-bounds-padding); flex: 1; display: flex; flex-direction: column; }

/* header */
.site-header {
  display: flex; align-items: center; gap: var(--header-gap);
  height: var(--header-height);
  border-bottom: 1px solid var(--color-separator);
  margin-bottom: var(--widget-gap);
}
.logo {
  color: var(--color-text-highlight);
  font-size: 2rem;
  height: 100%;
  display: flex; align-items: center;
  padding-right: var(--header-gap);
  border-right: 1px solid var(--color-separator);
}
.header-date { color: var(--color-text-base-muted); white-space: nowrap; }
.header-search {
  flex: 1; max-width: 32rem; min-width: 0;
  height: 3rem; padding: 0 1.2rem;
  background: var(--color-widget-background);
  border: 1px solid var(--color-widget-content-border);
  border-radius: var(--border-radius);
  color: var(--color-text-paragraph);
}
.header-search::placeholder { color: var(--color-text-subdue); }
.filter-group { display: flex; border: 1px solid var(--color-widget-content-border); border-radius: var(--border-radius); overflow: hidden; }
.filter-btn {
  background: transparent; border: 0; cursor: pointer;
  padding: 0.3rem 1.2rem; font-size: var(--font-size-h5);
  color: var(--color-text-base-muted);
}
.filter-btn + .filter-btn { border-left: 1px solid var(--color-widget-content-border); }
.filter-btn:hover { background: var(--color-widget-background-highlight); }
.filter-btn.active { color: var(--color-primary); background: var(--color-widget-background-highlight); }
.header-status { margin-left: auto; display: flex; align-items: center; gap: 1.4rem; font-size: var(--font-size-h5); color: var(--color-text-base-muted); }
.status-item { display: flex; align-items: center; gap: 0.7rem; }
.status-dot { width: 0.9rem; height: 0.9rem; border-radius: 50%; flex: none; }
.status-dot.ok { background: var(--color-positive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-positive) 25%, transparent), 0 0 8px var(--color-positive); }
.status-dot.alert { background: var(--color-negative); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-negative) 25%, transparent), 0 0 8px var(--color-negative); }

/* alert strip */
.alert-strip {
  background: var(--color-widget-background);
  border: 1px solid var(--color-widget-content-border);
  border-radius: var(--border-radius);
  box-shadow: 0 3px 0 var(--color-widget-shadow);
  padding: 0.5rem 1.7rem;
  margin-bottom: var(--widget-gap);
}
.alert-row { display: flex; align-items: center; gap: 1.2rem; padding: 0.8rem 0; }
.alert-row + .alert-row { border-top: 1px solid var(--color-separator); }
.alert-row .status-dot { width: 0.7rem; height: 0.7rem; }
.alert-row.high .status-dot { background: var(--color-negative); }
.alert-row.normal .status-dot { background: var(--color-primary); }
.alert-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-text-paragraph); }
.alert-meta { color: var(--color-text-subdue); white-space: nowrap; }
.tick-btn {
  background: transparent; cursor: pointer; flex: none;
  border: 1px solid var(--color-widget-content-border); border-radius: var(--border-radius);
  padding: 0.2rem 1rem; font-size: var(--font-size-h5); color: var(--color-text-base-muted);
}
.tick-btn:hover { background: var(--color-widget-background-highlight); color: var(--color-text-highlight); }

/* columns */
.columns {
  display: grid;
  grid-template-columns: var(--side-column-width) minmax(0, 1fr) var(--side-column-width);
  gap: var(--widget-gap);
  align-items: start;
}
.col { display: flex; flex-direction: column; gap: var(--widget-gap); min-width: 0; }

.site-footer { padding: var(--widget-gap) 0; text-align: center; font-size: var(--font-size-h6); color: var(--color-text-subdue); }

/* === utils.css === truncate, clamp-2, visited arrow, separators, thumbnail, size-h*, colour helpers */
/* (Tasks 3-5 add helpers here) */
.placeholder { color: var(--color-text-subdue); font-size: var(--font-size-h5); border: 1px dashed var(--color-separator); border-radius: var(--border-radius); padding: 1.5rem 1.7rem; }

/* === widgets.css === .card frame, .card-header, side vs center variants, states (stale/broken/hover/unseen) */
/* (Task 2) */

/* === types/kpi | markdown | table | list | media | calendar | bookmarks === */
/* (Tasks 3-5) */

/* === mobile.css === @media (max-width:1200px) */
/* (Task 6) */
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <a class="logo" href="#">Tickdeck</a>
    <span class="header-date">Wed, Oct 14 2026</span>
    <input class="header-search" type="search" placeholder="Search cards...">
    <div class="filter-group" role="group" aria-label="Filter">
      <button class="filter-btn active" type="button">All</button>
      <button class="filter-btn" type="button">Alerts</button>
      <button class="filter-btn" type="button">Cards</button>
    </div>
    <div class="header-status">
      <span class="status-item"><span class="status-dot ok"></span>connected</span>
      <span class="status-item"><span class="status-dot alert"></span>2 alerts</span>
    </div>
  </header>

  <section class="alert-strip" aria-label="Alerts">
    <div class="alert-row high">
      <span class="status-dot"></span>
      <span class="alert-text">Nightly backup failed: exit code 2 on host build-02</span>
      <span class="alert-meta">high &bull; 4m ago</span>
      <button class="tick-btn" type="button">Tick</button>
    </div>
    <div class="alert-row normal">
      <span class="status-dot"></span>
      <span class="alert-text">Weekly digest ready for review</span>
      <span class="alert-meta">normal &bull; 1h ago</span>
      <button class="tick-btn" type="button">Tick</button>
    </div>
  </section>

  <main class="columns">
    <aside class="col col-left">
      <!-- TASK 3 PLACEHOLDER: Calendar + KPI (with stale treatment) -->
      <div class="placeholder">Left column: calendar + KPI (Task 3)</div>
    </aside>
    <section class="col col-center">
      <!-- TASK 4 PLACEHOLDER: Now, email table, detailed list, media, low-prio, Completed -->
      <div class="placeholder">Center column: cards (Task 4)</div>
    </section>
    <aside class="col col-right">
      <!-- TASK 5 PLACEHOLDER: Bookmarks + Markdown -->
      <div class="placeholder">Right column: bookmarks + markdown (Task 5)</div>
    </aside>
  </main>

  <footer class="site-footer">Mockup - made-up data</footer>
</div>
</body>
</html>
